[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentgate"
version = "0.1.0"
description = "Open-source evaluation harness for enterprise agents"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "Open Fin" }
]
dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "fastapi>=0.110",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.29",
  "openpyxl>=3.1,<4",
  "defusedxml>=0.7,<1",
  "jsonschema>=4.23,<5",
  "cryptography>=41,<47",
  "celery[redis]==5.6.3",
  "celery-types>=0.26.0",
  "kombu==5.6.2",
  "redis==6.4.0",
  "opentelemetry-api>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "sqlalchemy>=2.0,<2.1",
  "pymysql>=1.1,<2",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27",
  "pytest>=8.0",
]

[project.scripts]
agentgate = "agentgate.cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[dependency-groups]
dev = [
    "ruff>=0.9,<1",
]
